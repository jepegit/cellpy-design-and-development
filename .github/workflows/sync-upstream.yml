# Mirror main from the canonical cellpy org repo into this fork.
# Do not commit directly to main here — open PRs on cellpy/architecture-plan instead.

name: Sync from cellpy/architecture-plan

on:
  schedule:
    # Every 6 hours (UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: true

jobs:
  sync:
    name: mirror main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reset main to upstream cellpy/architecture-plan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/cellpy/architecture-plan.git
          git fetch upstream main
          git checkout main
          git reset --hard upstream/main
          git push origin main --force-with-lease
